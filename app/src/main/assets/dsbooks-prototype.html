/* Full-screen reader with zoom buttons and two-finger pinch zoom */
.modal-bg.reader-open{padding:0;align-items:stretch}
.modal-bg.reader-open .modal{width:100%;max-width:none;height:100vh;height:100dvh;max-height:none;border-radius:0;overflow:hidden;box-shadow:none}
.modal-bg.reader-open .reader{height:100%;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.modal-bg.reader-open .reader-top{flex:0 0 auto;padding-top:max(8px,env(safe-area-inset-top));min-height:54px}
.modal-bg.reader-open .reader-top strong{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.modal-bg.reader-open .reader-controls{flex:0 0 auto;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.reader-status{flex:0 0 auto;text-align:center;padding:7px 12px;color:#85877f;font-size:11px;max-height:52px;overflow:auto}
.reader-viewport{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;background:#deddd6;touch-action:pan-x pan-y}
.reader-viewport .page{max-width:none;max-height:none;min-height:100%;margin:0 auto;padding:30px 24px;box-shadow:none}
.reader-viewport .page img{max-width:100%;height:auto}
.reader-viewport .page h1,.reader-viewport .page h2,.reader-viewport .page h3,.reader-viewport .page h4,.reader-viewport .page h5,.reader-viewport .page h6{font-size:1.3em}
.reader-zoom{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.reader-zoom button{min-width:34px;height:34px;border:1px solid #deddd4;border-radius:9px;background:#fffefa;color:#454a43;font-size:18px;line-height:1}
.reader-zoom .zoom-reset{min-width:48px;font-size:10px;padding:0 5px}
.reader-viewport.pdf-viewport{background:#777;touch-action:pan-y}
#pdfImage{display:block;width:100%;height:auto;margin:0 auto}
.reader-viewport.epub-pages{overflow-x:auto;overflow-y:hidden;scrollbar-width:none;scroll-snap-type:x mandatory;touch-action:pan-x}
.reader-viewport.epub-pages::-webkit-scrollbar{display:none}
.reader-viewport.epub-pages .page{max-width:none;min-height:0;height:100%;margin:0;padding:24px 28px;box-shadow:none;column-fill:auto;column-gap:28px;scroll-snap-align:start}
.reader-viewport.epub-pages .page>*{break-inside:avoid}
.reader-viewport.epub-pages .page img{max-height:100%;break-inside:avoid}
@media(max-width:760px){.modal-bg.reader-open .reader-top{padding-left:7px;padding-right:7px;gap:3px}.modal-bg.reader-open .reader-top strong{flex:1 1 0;min-width:0;white-space:nowrap;text-overflow:ellipsis;font-size:10px}.modal-bg.reader-open .reader-top button,.modal-bg.reader-open .reader-top .tool-btn{padding:4px;flex:0 0 auto;font-size:15px}.reader-viewport .page{padding:25px 18px}.modal-bg.reader-open .reader-controls{gap:6px}.reader-zoom{gap:2px}.reader-zoom button{width:29px;min-width:29px;height:30px;font-size:15px}.reader-zoom .zoom-reset{width:41px;min-width:41px;font-size:9px}}

.folder-detail .book-card[hidden]{display:none}
.folder-detail .book-card:after{content:"";position:absolute;bottom:0;left:-7px;right:-7px;height:7px;background:linear-gradient(180deg,#e9b36b,#a85f30 35%,#4d2814);box-shadow:0 3px 4px #1c0f0b90}
.folder-detail .vinyl-disc{right:6px}
.folder-detail .cover-wrap{width:100%;max-width:180px}

   const total=Number(state?.data?.total);if(!Number.isSafeInteger(total)||total<0)throw new Error('検索件数を取得できません。一覧を変更せず保持しました。');
   for(let offset=0;offset<total;offset+=500){
    const page=await dsmCall('SYNO.FileStation.Search','list',{taskid:task,offset:String(offset),limit:'500',additional:JSON.stringify(['size','time','type'])});
    const entries=scanEntries(page,offset);if(entries.length!==Math.min(500,total-offset))throw new Error('検索結果が不完全です。一覧を変更せず保持しました。');files=files.concat(entries);if(out)out.textContent=`検索結果を取得中… ${Math.min(offset+500,total)} / ${total}件`;
   }
  }
  const downloads=JSON.parse(localStorage.getItem('dsbooks.downloads')||'{}');const previous=new Map(books.filter(b=>b.remote).map(b=>[String(b.path),b]));
  const found=files.map((f,i)=>{
   const name=String(f.name||f.path||'');const ext=(name.match(/\.([^.\/]+)$/)?.[1]||f.additional?.type||'').toLowerCase();
   const type=ext==='pdf'?'PDF':ext==='epub'?'ePub':ext==='md'?'Markdown':ext==='jisui'?'Jisui':['cbz','cbr'].includes(ext)?'Comic':'Audio';const path=String(f.path||'');
   const cached=downloads[path]||previous.get(path)?.localName||null;const offline=!!(cached&&window.DSBooksNative&&DSBooksNative.hasBook(cached));
   const prior=previous.get(path)||{};const folder=folderForSavedPath(path,targetPaths);const rawTime=f.additional?.time;const rawStamp=rawTime&&typeof rawTime==='object'?(rawTime.ctime||rawTime.mtime||rawTime.modified||0):rawTime;const stamp=Number(rawStamp)||0;return{...prior,stale:false,libraryExcluded:false,id:path,path,title:prior.metadataTitle||name.replace(/\.[^.]+$/,''),author:path.split('/').slice(-2,-1)[0]||'NAS',folder,type,fileExt:ext.toUpperCase(),genre:'NAS',cover:prior.cover||'c'+((i%12)+1),offline,localName:cached||prior.localName||null,progress:prior.progress||0,currentPage:prior.currentPage||0,pageCount:prior.pageCount||0,bookmarkPage:prior.bookmarkPage||null,modifiedAt:stamp<1000000000000?stamp*1000:stamp,label:formatBytes(f.additional?.size||0),size:f.additional?.size||0,remote:true,desc:'Synology NASから取得した蔵書情報。'};
  });
  const foundPaths=new Set(found.map(b=>String(b.path)));const priorMissing=[...previous.values()].filter(b=>!foundPaths.has(String(b.path))).map(b=>{const cached=downloads[b.path]||b.localName||null;const exists=!!(cached&&window.DSBooksNative&&DSBooksNative.hasBook(cached));const libraryExcluded=!targetPaths.some(root=>String(b.path).startsWith(root.replace(/\/$/,'')+'/'));return{...b,stale:true,libraryExcluded,localName:cached,offline:exists}});const nextBooks=[...found,...priorMissing,...books.filter(b=>!b.remote&&b.localName)];
  // Commit only after every scope/result page succeeds. Never delete downloaded files.
  localStorage.setItem('dsbooks.catalog',JSON.stringify(nextBooks));books=nextBooks;savedScanRoots=targetPaths.slice();localStorage.setItem('dsbooks.scanRoots',JSON.stringify(savedScanRoots));publishWidgetBooks();remoteMode=true;render();
  const excluded=priorMissing.filter(b=>b.libraryExcluded).length,unconfirmed=priorMissing.length-excluded;
  if(out)out.textContent=`検索完了：NASで確認 ${found.length}件${excluded?`／対象外 ${excluded}件を本棚から非表示（保存済みファイル・読書記録は保持）`:''}${unconfirmed?`／NAS未確認 ${unconfirmed}件`:''}`;
  document.getElementById('nasName').textContent='自宅の本棚';document.getElementById('nasState').innerHTML='<i class="dot"></i> DSM接続中';
  document.getElementById('nasSub').textContent='Tailscale · '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})+'に同期';
  if(!books.some(inLibrary))toast('対象の本は0件です。保存済みファイルは「保存済み」から開けます');else toast(found.length+'件を確認'+(excluded?'・対象外の本を一覧から外しました':''));
 }catch(e){if(out)out.textContent='検索失敗：'+(e.message||'DSM APIエラー');else toast(e.message||'検索できませんでした')}
 finally{libraryScanRunning=false;if(task)dsmCall('SYNO.FileStation.Search','clean',{taskid:task}).catch(()=>{});if(button){button.disabled=false;button.textContent='選択した場所をスキャン'}}
}
function loadCachedCatalog(){
 try{
  const list=JSON.parse(localStorage.getItem('dsbooks.catalog')||'null');
  if(Array.isArray(list)){
   const downloads=JSON.parse(localStorage.getItem('dsbooks.downloads')||'{}');
   books=list.map(b=>{const localName=downloads[b.path]||b.localName||null;const exists=!!(localName&&(b.offline||downloads[b.path]));return{...b,localName:localName,offline:exists}});
   remoteMode=true;document.getElementById('nasState').innerHTML='<i class="dot" style="background:#d1a453;box-shadow:none"></i> オフライン本棚';document.getElementById('nasSub').textContent='前回スキャンした蔵書情報';
  }
 }catch(e){DSBoot.catalogError=true;books=[];}
}

document.getElementById('search').oninput=e=>{query=e.target.value;render()};document.getElementById('sort').onchange=render;document.getElementById('folderFilter').onchange=e=>{activeFolder=e.target.value;localStorage.setItem('dsbooks.activeFolder',activeFolder);activeGenre='';activeNav='home';render()};document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');activeType=b.dataset.type;activeGenre='';activeNav='home';render()}));document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('selected',x===b));render()});document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{activeNav=b.dataset.nav;activeGenre='';activeFolder='';document.getElementById('folderFilter').value='';activeType='all';document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===activeNav));document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('selected',x.dataset.type==='all'));render()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{activeGenre=b.dataset.filter;activeType='all';activeNav='home';render()});document.getElementById('syncBtn').onclick=()=>dsmConn?scanLibrary(savedShares):openConnectModal();document.getElementById('connectBtn').onclick=openConnectModal;document.getElementById('settingsBtn').onclick=()=>toast('設定画面は次の試作で追加予定');document.getElementById('mobileSettings').onclick=()=>toast('設定画面は次の試作で追加予定');document.getElementById('modalBg').onclick=e=>{if(e.target.id==='modalBg')closeModal()};document.getElementById('miniToggle').onclick=()=>DSBooksNative?.playbackAction(playbackSnapshot.playing?'pause':'play',0,Number(playbackSnapshot.speed)||1);document.getElementById('miniStop').onclick=()=>DSBooksNative?.playbackAction('stop',0,1);document.getElementById('miniOpen').onclick=()=>{if(playbackSnapshot.kind==='audio'){const b=books.find(audioMatches)||audioBook;if(b)audio(b);}else if(playbackSnapshot.kind==='tts')toast('読み上げは通知またはここから一時停止・停止できます')};loadCachedCatalog();if(window.DSBooksNative){document.getElementById('versionLabel').textContent='v'+DSBooksNative.getAppVersion().replace('-preview','');try{savedLogin=JSON.parse(DSBooksNative.loadCredentials()||'null')}catch(e){}try{window.restoreDownloadState(JSON.parse(DSBooksNative.getDownloadState()||'{}'))}catch(e){}try{window.onPlaybackState(JSON.parse(DSBooksNative.getPlaybackState()||'{"active":false}'))}catch(e){}if(savedLogin?.sid)setTimeout(()=>resumeNasSession(),300)}else document.getElementById('versionLabel').textContent='Web Preview';
async function resumeNasSession(){const base=savedLogin.base;try{const discovery=await dsmPost(apiUrl(base,'entry.cgi'),{api:'SYNO.API.Info',version:'1',method:'query',query:'all'});const apis=discovery.data||{};dsmConn={base,apis,sid:savedLogin.sid};try{await dsmCall('SYNO.FileStation.List','list_share',{})}catch(expired){const auth=apis['SYNO.API.Auth'];if(!auth)throw expired;const v=Math.min(3,Number(auth.maxVersion||auth.version||3));const login=await dsmPost(apiUrl(base,auth.path),{api:'SYNO.API.Auth',version:String(v),method:'login',account:savedLogin.account,passwd:savedLogin.password,session:'FileStation',format:'sid'});if(!login.data?.sid)throw expired;dsmConn.sid=login.data.sid;savedLogin.sid=login.data.sid;DSBooksNative.saveCredentials(base,savedLogin.account,savedLogin.password,savedLogin.sid);await dsmCall('SYNO.FileStation.List','list_share',{})}document.getElementById('nasState').innerHTML='<i class="dot"></i> DSM接続中';document.getElementById('nasSub').textContent='保存したログインで再接続';render();}catch(e){dsmConn=null;document.getElementById('nasState').innerHTML='<i class="dot" style="background:#d1a453;box-shadow:none"></i> 再接続が必要';document.getElementById('nasSub').textContent='NASの確認コードが必要な場合はタップして入力';}}
